name: Flutter APK Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Compatible with your runner version

      - name: Set up JDK
        uses: actions/setup-java@v2 # Downgraded to v2 for compatibility
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v1 # Using v1 instead of v2 for compatibility
        with:
          flutter-version: '3.19.5' # Specify your Flutter version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter doctor
        run: flutter doctor -v

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v2 # Using v2 instead of v3
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v2 # Using v2 instead of v3
        with:
          name: release-apk

      - name: Rename APK (optional)
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk app-release.apk ||
          mv app-release.apk app-release.apk # Fallback if path differs

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Flutter APK Release
            - Version: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built on: ${{ github.event.head_commit.timestamp }}
          files: app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
