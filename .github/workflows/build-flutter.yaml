name: Flutter APK Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v2
        with:
          version: '3.22.0'  # This version includes Dart SDK 3.5.x
          channel: 'stable'

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get
      
      - name: Check directory structure
        run: |
          pwd
          ls -la
          find . -name "pubspec.yaml" -type f

      - name: Build APK
        run: |
          flutter build apk --release --verbose

      - name: Check build output
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "APK output directory not found"
          find build -name "*.apk" -type f || echo "No APK files found in build directory"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./
      
      - name: List files
        run: |
          pwd
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
