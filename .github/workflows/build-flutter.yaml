name: Flutter APK Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Flutter (exact version)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.2'  # updated from 3.19.5
          cache: false

      - name: Verify Flutter Installation
        run: |
          echo "Expected: Flutter 3.29.2 • Dart 3.7.2"
          flutter --version
          if ! flutter --version | grep -q "3.29.2"; then
            echo "::error::Wrong Flutter version installed!"
            exit 1
          fi
          if ! dart --version | grep -q "3.7.2"; then
            echo "::error::Wrong Dart version installed!"
            exit 1
          fi

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses
      
      - name: Generate keys.dart from secrets
        run: |
          mkdir -p lib/src/common/tdlib/client/configuration
          cat <<EOF > lib/src/common/tdlib/client/configuration/keys.dart
          class TelegramAPIKeys {
            static const int apiId = ${API_ID};
            static const String apiHash = '${API_HASH}';
          }
          EOF
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Remove -Werror from video_player_android
        run: |
          sed -i 's/["'\'']-Werror["'\'']//g' \
          ~/.pub-cache/hosted/pub.dev/video_player_android-*/android/build.gradle
      - name: Build debug APK (sanity check)
        run: flutter build apk --debug

      - name: Build release APK
        run: |
          flutter build apk --release --verbose 2>&1 | tee build.log
          echo "BUILD_LOG=$(cat build.log | base64 -w 0)" >> $GITHUB_ENV

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./release-apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
