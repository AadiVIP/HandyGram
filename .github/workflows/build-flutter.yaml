name: Flutter APK Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Use the EXACT version from Flutter's release archive
          flutter-version: '3.19.5-stable'  # ← Note "-stable" suffix
          cache: false  # Disable cache to force fresh install
      - name: Verify Flutter Installation
            run: |
              echo "Expected Flutter: 3.19.5 (Dart 3.5.2)"
              flutter --version
              if ! flutter --version | grep -q "3.19.5"; then
                echo "::error::Wrong Flutter version installed!"
                exit 1
              fi
              if ! dart --version | grep -q "3.5.2"; then
                echo "::error::Wrong Dart version installed!"
                exit 1
              fi
      - name: Check Flutter environment
        run: |
          flutter --version
          flutter doctor -v
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Check directory structure
        run: |
          pwd
          ls -la
          find . -name "pubspec.yaml" -type f
          find . -name "build.gradle" -type f

      - name: Build APK with detailed logging
        run: |
          flutter build apk --release --verbose 2>&1 | tee build.log
          # Save the build log as an artifact
          echo "BUILD_LOG=$(cat build.log | base64 -w 0)" >> $GITHUB_ENV
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Check build output
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "APK output directory not found"
          find build -name "*.apk" -type f || echo "No APK files found in build directory"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./
      
      - name: List files
        run: |
          pwd
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
