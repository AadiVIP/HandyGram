workflows:
  flutter_build:
    name: Flutter Build
    max_build_duration: 60
    instance_type: macos
    environment:
      flutter: stable
      xcode: latest
      java: openjdk-17  # Ensure you are using Java 17
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
