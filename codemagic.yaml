workflows:
  flutter_build:
    name: Build APK
    max_build_duration: 60
    instance_type: mac_mini
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
